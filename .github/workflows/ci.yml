name: CI

# Quality gates. Runs on pull requests to main and on pushes to main.
# This workflow only validates; it never deploys. Deployments are always run by an operator with an explicit
#   --profile <profile> and the home region spelled out (the deployment scripts fall back to defaults silently
#   when a positional argument is omitted; see docs/deployment.md).
# No AWS credentials are needed: every job is a static check, a unit-test run or a synthesis inside the sandbox.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Older runs on the same branch are cancelled automatically to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # only used to post a cdk diff summary as a pull-request comment

jobs:
  redline-scan:
    name: Red-line scan (no secrets or account ids in the repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files
        run: bash scripts/redline-scan.sh

  platform:
    name: Platform (build gate + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Dependency advisories (production dependencies, high and critical fail the job)
        run: npm audit --omit=dev --audit-level=high
      - name: 'core-dist consistency gate (every AI capability bundle must equal the compiled output of its core sources)'
        # Drift guard: core-dist is the committed CJS bundle that the skills Lambda requires and the agent containers import.
        # If someone changes a capability's core/*.ts but forgets to run the prebuild before deploying, a stale bundle
        # would be shipped and the TypeScript source and the bundle would diverge.
        #
        # Checking a single capability is not enough: a stale bundle of another capability would stay green until the
        #   next full deployment rebuilt it. The gate therefore rebuilds every capability with `core-prebuild.sh all`
        #   and diffs all four core-dist directories (genbi, cookbook, paramadvisor, netadvisor); any drift fails the job.
        working-directory: ${{ github.workspace }}
        run: |
          bash scripts/core-prebuild.sh all
          if ! git diff --exit-code -- \
              infra/lambda/genbi-skills/core-dist/ \
              infra/agent/genbi/core-dist/ \
              infra/agent/paramadvisor/core-dist/ \
              infra/agent/netadvisor/core-dist/; then
            echo "::error::core-dist differs from its core sources (genbi, cookbook, paramadvisor or netadvisor). Run 'bash scripts/core-prebuild.sh all' and commit the refreshed core-dist."
            exit 1
          fi
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build gate (next build, including lint and type checking)
        run: npm run build
        env:
          # The build does not contact a real Cognito pool; authentication variables are deliberately unset for this CI build.
          NEXT_TELEMETRY_DISABLED: "1"

  infra:
    name: Infrastructure (tsc + cdk synth)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Dependency advisories (production dependencies, high and critical fail the job)
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript compile gate
        run: npm run build
      - name: CDK synth (no account access; placeholder env, only checks that the templates synthesize)
        run: npx cdk synth --all --quiet
        env:
          # synth needs no real credentials; a placeholder account and region let the env-aware stacks synthesize.
          # Real deployments are always run by an operator with an explicit --profile.
          CDK_DEFAULT_ACCOUNT: "000000000000"
          CDK_DEFAULT_REGION: us-east-1
